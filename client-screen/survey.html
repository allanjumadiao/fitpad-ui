<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitpad - Trainee Feedback Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F3F4F6; }
        .brand-yellow { color: #d6ed17; }
        .bg-brand-yellow { background-color: #d6ed17; }
        .bg-fitpad-gray { background-color: #606060; }
        .text-fitpad-gray { color: #606060; }
        
        /* Entrance animation for cards */
        .slide-up {
            animation: slideUp 0.4s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success Pulse Animation */
        .circle-pulse {
            animation: circlePulse 2s infinite;
        }
        @keyframes circlePulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gray-50 py-8 px-4">

    <!-- PREVIEW BANNER (Shown if admin preview mode) -->
    <div id="preview-mode-banner" class="hidden max-w-xl w-full mx-auto mb-6 bg-amber-500 text-white font-bold text-xs uppercase tracking-widest px-6 py-3 rounded-2xl flex items-center justify-between shadow-sm shrink-0">
        <span class="flex items-center gap-2">
            <ion-icon name="eye" class="text-lg"></ion-icon> Admin Preview Mode
        </span>
        <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded font-black">Read Only</span>
    </div>

    <!-- MAIN SURVEY CONTAINER -->
    <div class="max-w-xl w-full mx-auto flex-1 flex flex-col justify-start">
        
        <!-- Back Button -->
        <div class="mb-6 shrink-0">
            <button onclick="handleBackAction()" class="flex items-center gap-2 text-xs font-bold text-gray-400 hover:text-fitpad-gray uppercase tracking-widest transition-colors">
                <ion-icon name="arrow-back-outline" class="text-base"></ion-icon> Go Back
            </button>
        </div>

        <!-- SURVEY CONTENT AREA -->
        <div id="survey-form-container" class="space-y-6 flex-1 flex flex-col">
            <!-- Dynamic Survey Details & Questions Injected here -->
        </div>

        <!-- SURVEY SUCCESS AREA (Hidden by default) -->
        <div id="survey-success-container" class="hidden flex-1 flex flex-col justify-center items-center py-12 text-center slide-up">
            <div class="w-24 h-24 rounded-full bg-emerald-500 text-white flex items-center justify-center text-5xl mb-6 shadow-lg border-4 border-white circle-pulse">
                <ion-icon name="checkmark"></ion-icon>
            </div>
            
            <h2 class="text-2xl font-black text-fitpad-gray uppercase tracking-tight mb-2">Response Submitted!</h2>
            <p class="text-sm text-gray-500 font-medium leading-relaxed max-w-sm mb-8">
                Thank you for sharing your feedback. Your response has been recorded and will help us improve your personal training experience.
            </p>
            
            <button onclick="handleBackAction()" class="bg-fitpad-gray text-white px-8 py-3.5 rounded-xl text-xs font-black uppercase tracking-widest hover:brightness-125 transition-all shadow-md">
                Return to Fitpad
            </button>
        </div>

    </div>

    <!-- Custom Alert System -->
    <div id="globalModal" class="fixed inset-0 z-[9999] hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity opacity-0">
        <div id="globalModalContent" class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="p-8 text-center">
                <div id="globalModalIcon" class="w-16 h-16 mx-auto rounded-full bg-brand-yellow/20 text-yellow-600 flex items-center justify-center text-3xl mb-6"><ion-icon name="information-circle"></ion-icon></div>
                <h3 id="globalModalTitle" class="text-xl font-black text-fitpad-gray uppercase tracking-tight mb-2">Notice</h3>
                <p id="globalModalMessage" class="text-sm text-gray-500 font-medium leading-relaxed mb-8">Message goes here.</p>
                <div id="globalModalActions" class="flex flex-col gap-3"></div>
            </div>
        </div>
    </div>

    <!-- Alert helper script -->
    <script src="../js/custom-alert.js"></script>

    <!-- SURVEY FORM LOGIC -->
    <script>
        let surveyObj = null;
        let isPreview = false;
        let referrer = 'dashboard';

        window.onload = function() {
            // Parse query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const surveyId = urlParams.get('id');
            const previewParam = urlParams.get('preview');
            const refParam = urlParams.get('ref');

            if (refParam) referrer = refParam;

            if (previewParam === 'true' || surveyId === 'preview') {
                isPreview = true;
                document.getElementById('preview-mode-banner').classList.remove('hidden');
            }

            if (!surveyId) {
                renderErrorState('No survey specified.');
                return;
            }

            loadSurvey(surveyId);
        };

        // Load survey data
        function loadSurvey(id) {
            const surveys = JSON.parse(localStorage.getItem("fitpad_surveys") || "[]");
            let survey = surveys.find(s => s.id === id);
            
            // Fallback for default seed surveys if not loaded yet
            if (!survey && id.startsWith('SRV-')) {
                // If local storage is empty, fetch default surveys array
                const defaultSurveys = [
                    {
                        id: "SRV-20912",
                        title: "Coach Feedback Survey",
                        description: "Tell us how your coach is doing and how we can improve your training sessions.",
                        locations: ["dashboard", "profile"],
                        active: true,
                        questions: [
                            { id: "q-1", type: "choice", title: "How would you rate your coach's responsiveness?", required: true, options: ["Excellent", "Good", "Average", "Poor"] },
                            { id: "q-2", type: "paragraph", title: "What does your coach do best during training sessions?", required: false },
                            { id: "q-3", type: "choice", title: "Would you recommend this coach to a friend?", required: true, options: ["Yes", "No", "Not sure"] }
                        ]
                    },
                    {
                        id: "SRV-48123",
                        title: "PT Feedback Survey",
                        description: "Help us evaluate our personal training session structures and routines.",
                        locations: ["session", "session-list"],
                        active: true,
                        questions: [
                            { id: "q-4", type: "choice", title: "Was the session duration appropriate for your fitness goal?", required: true, options: ["Too short", "Just right", "Too long"] },
                            { id: "q-5", type: "checkbox", title: "Which exercises did you find most challenging?", required: false, options: ["Strength/Squats", "Cardio/HIIT", "Core/Plank", "Mobility/Stretching"] },
                            { id: "q-6", type: "short", title: "Any additional remarks for your trainer?", required: false }
                        ]
                    }
                ];
                survey = defaultSurveys.find(s => s.id === id);
            }

            if (!survey) {
                renderErrorState('The requested survey could not be found.');
                return;
            }

            surveyObj = survey;
            renderSurveyForm();
        }

        // Render error helper
        function renderErrorState(msg) {
            const container = document.getElementById('survey-form-container');
            container.innerHTML = `
                <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center slide-up">
                    <ion-icon name="alert-circle" class="text-5xl text-red-500 mb-4"></ion-icon>
                    <h3 class="text-lg font-black text-fitpad-gray uppercase tracking-tight mb-2">Error Loading Survey</h3>
                    <p class="text-sm text-gray-500 font-medium mb-6">${msg}</p>
                    <button onclick="handleBackAction()" class="bg-fitpad-gray text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:brightness-125 transition-all">Go Back</button>
                </div>
            `;
        }

        // Render dynamic survey questions form
        function renderSurveyForm() {
            const container = document.getElementById('survey-form-container');
            container.innerHTML = '';

            // 1. Header Card (Title & Description)
            const headerCard = document.createElement('div');
            headerCard.className = "bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 relative overflow-hidden slide-up";
            headerCard.innerHTML = `
                <div class="absolute left-0 inset-y-0 w-2 bg-brand-yellow"></div>
                <h2 class="text-xl md:text-2xl font-black text-fitpad-gray uppercase tracking-tight">${surveyObj.title}</h2>
                <p class="text-sm text-gray-400 font-medium leading-relaxed mt-3">${surveyObj.description || 'Please fill in this short survey form.'}</p>
                <p class="text-[10px] text-red-500 font-bold uppercase tracking-widest mt-4 flex items-center gap-1">
                    * Required field
                </p>
            `;
            container.appendChild(headerCard);

            // 2. Question Cards
            surveyObj.questions.forEach((q, index) => {
                const qCard = document.createElement('div');
                qCard.className = "bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 slide-up space-y-4 transition-all duration-300";
                qCard.id = `question-block-${q.id}`;
                
                let requiredHtml = q.required ? '<span class="text-red-500 ml-1">*</span>' : '';
                
                let inputHtml = '';
                
                if (q.type === 'short') {
                    inputHtml = `<input type="text" id="ans-${q.id}" placeholder="Your answer" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-xl text-sm font-semibold text-fitpad-gray outline-none focus:ring-2 focus:ring-[#d6ed17]/50 focus:border-[#d6ed17] transition-all">`;
                } else if (q.type === 'paragraph') {
                    inputHtml = `<textarea id="ans-${q.id}" rows="4" placeholder="Your answer" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-xl text-sm font-medium text-fitpad-gray outline-none focus:ring-2 focus:ring-[#d6ed17]/50 focus:border-[#d6ed17] transition-all resize-none"></textarea>`;
                } else if (q.type === 'choice') {
                    inputHtml = `<div class="space-y-3">`;
                    q.options.forEach((opt, optIndex) => {
                        inputHtml += `
                            <label class="flex items-center gap-3 cursor-pointer group p-1.5 rounded-lg hover:bg-gray-50 transition-colors">
                                <input type="radio" name="ans-group-${q.id}" value="${opt}" class="text-brand-yellow focus:ring-brand-yellow h-5 w-5 border-gray-300">
                                <span class="text-sm font-bold text-gray-500 group-hover:text-fitpad-gray transition-colors">${opt}</span>
                            </label>
                        `;
                    });
                    inputHtml += `</div>`;
                } else if (q.type === 'checkbox') {
                    inputHtml = `<div class="space-y-3">`;
                    q.options.forEach((opt, optIndex) => {
                        inputHtml += `
                            <label class="flex items-center gap-3 cursor-pointer group p-1.5 rounded-lg hover:bg-gray-50 transition-colors">
                                <input type="checkbox" name="ans-group-${q.id}" value="${opt}" class="rounded text-brand-yellow focus:ring-brand-yellow h-5 w-5 border-gray-300">
                                <span class="text-sm font-bold text-gray-500 group-hover:text-fitpad-gray transition-colors">${opt}</span>
                            </label>
                        `;
                    });
                    inputHtml += `</div>`;
                } else if (q.type === 'dropdown') {
                    inputHtml = `
                        <div class="relative">
                            <select id="ans-${q.id}" class="w-full bg-gray-50 border border-gray-200 p-3.5 rounded-xl text-sm font-bold text-fitpad-gray outline-none focus:ring-2 focus:ring-[#d6ed17]/50 focus:border-[#d6ed17] appearance-none cursor-pointer">
                                <option value="" disabled selected>Select an option...</option>
                                ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                            <ion-icon name="chevron-down-outline" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></ion-icon>
                        </div>
                    `;
                }

                qCard.innerHTML = `
                    <label class="block text-sm font-black text-fitpad-gray tracking-tight">${index + 1}. ${q.title}${requiredHtml}</label>
                    <div class="mt-2">
                        ${inputHtml}
                    </div>
                    <p id="error-msg-${q.id}" class="hidden text-[10px] text-red-500 font-bold uppercase tracking-widest mt-2 flex items-center gap-1">
                        <ion-icon name="alert-circle-outline" class="text-sm"></ion-icon> This question is required
                    </p>
                `;
                container.appendChild(qCard);
            });

            // 3. Submit Action Button
            const submitBtn = document.createElement('button');
            submitBtn.onclick = submitSurveyAnswers;
            submitBtn.className = "w-full py-4 bg-fitpad-gray text-white font-black text-xs uppercase tracking-widest hover:brightness-125 rounded-2xl shadow-md transition-all slide-up mt-2 shrink-0";
            submitBtn.innerText = isPreview ? "Submit (Preview Simulation)" : "Submit Response";
            container.appendChild(submitBtn);
        }

        // Validate and submit survey response
        function submitSurveyAnswers() {
            let isValid = true;
            let firstInvalidBlock = null;
            const answers = [];

            // Reset error highlights
            surveyObj.questions.forEach(q => {
                const block = document.getElementById(`question-block-${q.id}`);
                const errMsg = document.getElementById(`error-msg-${q.id}`);
                if (block) block.className = "bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 slide-up space-y-4 transition-all duration-300";
                if (errMsg) errMsg.classList.add('hidden');
            });

            // Loop to extract answers & validate required inputs
            surveyObj.questions.forEach(q => {
                let answerVal = null;

                if (q.type === 'short' || q.type === 'paragraph' || q.type === 'dropdown') {
                    const el = document.getElementById(`ans-${q.id}`);
                    if (el) {
                        answerVal = el.value.trim();
                    }
                } else if (q.type === 'choice') {
                    const elSelected = document.querySelector(`input[name="ans-group-${q.id}"]:checked`);
                    if (elSelected) {
                        answerVal = elSelected.value;
                    }
                } else if (q.type === 'checkbox') {
                    const elsChecked = document.querySelectorAll(`input[name="ans-group-${q.id}"]:checked`);
                    if (elsChecked.length > 0) {
                        answerVal = Array.from(elsChecked).map(cb => cb.value);
                    }
                }

                // Check required state
                if (q.required && (!answerVal || (Array.isArray(answerVal) && answerVal.length === 0))) {
                    isValid = false;
                    
                    // Highlight question card
                    const block = document.getElementById(`question-block-${q.id}`);
                    const errMsg = document.getElementById(`error-msg-${q.id}`);
                    if (block) {
                        block.className = "bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-red-500 slide-up space-y-4 transition-all duration-300";
                    }
                    if (errMsg) {
                        errMsg.classList.remove('hidden');
                    }

                    if (!firstInvalidBlock) {
                        firstInvalidBlock = block;
                    }
                }

                answers.push({
                    question_id: q.id,
                    question_title: q.title,
                    value: answerVal
                });
            });

            // Highlight error state
            if (!isValid) {
                if (firstInvalidBlock) {
                    firstInvalidBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                FitpadAlert.show({ type: 'error', title: 'Required Fields', message: 'Please answer all required questions before submitting.' });
                return;
            }

            // Save Response
            if (!isPreview) {
                // Save answers to local storage responses log
                const responses = JSON.parse(localStorage.getItem("fitpad_survey_responses") || "[]");
                responses.push({
                    survey_id: surveyObj.id,
                    survey_title: surveyObj.title,
                    answers: answers,
                    submittedAt: new Date().toISOString()
                });
                localStorage.setItem("fitpad_survey_responses", JSON.stringify(responses));

                // Mark survey as completed so prompt banner doesn't show again
                localStorage.setItem(`fitpad_completed_surveys_${surveyObj.id}`, 'true');
            }

            // Transition to success screen
            document.getElementById('survey-form-container').classList.add('hidden');
            document.getElementById('survey-success-container').classList.remove('hidden');
        }

        // Back button router
        function handleBackAction() {
            if (isPreview) {
                window.location.href = '../admin-screen/setting.html?tab=surveys';
                return;
            }

            // Client route redirect
            let targetPage = 'dashboard.html';
            if (referrer === 'session-list') targetPage = 'session-list.html';
            else if (referrer === 'session') targetPage = 'session.html';
            else if (referrer === 'profile') targetPage = 'profile.html';

            window.location.href = targetPage;
        }
    </script>
</body>
</html>
