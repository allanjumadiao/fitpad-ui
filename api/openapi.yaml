          example: null

    ClientDashboard:
      type: object
      description: Full client dashboard payload.
      properties:
        coach:
          type: object
          description: Assigned coach summary.
          properties:
            name:
              type: string
              example: "Sarah Adams"
            initials:
              type: string
              description: First letter of first name + first letter of last name.
              example: "SA"
            coach_id:
              type: string
              description: Unique coach identity badge (e.g. CP-8820).
              example: "CP-8820"
        session_balance:
          $ref: '#/components/schemas/SessionBalance'
        next_session:
          $ref: '#/components/schemas/NextSession'

    SessionBalance:
      type: object
      description: |
        Session usage breakdown for the client's current active plan.
        - `base` = sessions from the chosen session plan.
        - `free` = complimentary/bonus sessions added on top.
        - `total` = base + free.
        - `used` = total - remaining.
        - `days_left` is null when `is_validity_paused` is true (status is not active).
      properties:
        base:
          type: integer
          description: Sessions from the selected session plan.
          example: 12
        free:
          type: integer
          description: Complimentary bonus sessions added on top of the plan.
          example: 2
        total:
          type: integer
          description: Total sessions available (base + free).
          example: 14
        used:
          type: integer
          description: Sessions already consumed (total - remaining).
          example: 4
        remaining:
          type: integer
          description: Sessions still available.
          example: 10
        days_left:
          type: integer
          nullable: true
          description: Days remaining until plan validity expires. Null when paused.
          example: 28
        validity_ends_at:
          type: string
          format: date
          nullable: true
          description: The absolute date the plan expires.
          example: "2026-07-13"
        is_validity_paused:
          type: boolean
          description: True when the client status is not active (freezed, pending, finished, inactive). Countdown is paused.
          example: false

    NextSession:
      type: object
      nullable: true
      description: The client's next upcoming scheduled session. Null if no future session is scheduled.
      properties:
        id:
          type: integer
          description: The `client_schedules` primary key (used for cancellation requests).
          example: 5
        scheduled_date:
          type: string
          format: date
          example: "2026-05-13"
        day_of_week:
          type: string
          description: Full name of the day of the week.
          example: "Wednesday"
        time_slot:
          type: string
          description: Human-readable time range of the session.
          example: "09:00 AM - 10:00 AM"
        cancellation_status:
          type: string
          nullable: true
          enum: [pending, approved, rejected, rescheduled]
          description: Status of any existing cancellation request for this session. Null if none.
          example: null

    SessionCancellationRequest:
      type: object
      description: A client's request to cancel an upcoming scheduled session.
      properties:
        id:
          type: integer
          example: 1
        client_schedule_id:
          type: integer
          description: The schedule being requested for cancellation.
          example: 5
        reason:
          type: string
          description: Client's stated reason.
          example: "I have a medical appointment that was moved to this time slot."
        status:
          type: string
          enum: [pending, approved, rejected, rescheduled]
          description: |
            Current review status of the cancellation request.
            - `pending` — awaiting coach/admin review
            - `approved` — session cancelled
            - `rejected` — cancellation denied, session stands
            - `rescheduled` — coach resolved request by moving the session to a new date/time
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2026-06-13T09:30:00Z"

