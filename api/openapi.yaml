  # =========================================================================
  # TRAINEE PORTAL
  # =========================================================================
  /api/client/dashboard:
    get:
      security:
        - BearerToken: []
      tags:
        - Trainee Portal
      summary: Trainee Dashboard Stats
      description: |
        Returns the full client dashboard payload including assigned coach information,
        session balance breakdown (base plan + complimentary sessions), and the next
        upcoming scheduled session.

        **Days Left rules:**
        - `days_left` counts down only when `client_details.status = active`.
        - The countdown is **paused** (not decremented) when the status is `freezed`, `pending`, `finished`, or `inactive`. The `is_validity_paused` flag reflects this state.

        **Session Balance formula:**
        - `total = base + free` (where `free` = complimentary bonus sessions)
        - `used  = total - remaining`
      responses:
        '200':
          description: Client dashboard payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDashboard'
        '401':
          description: Unauthenticated — missing or invalid Bearer token.
        '403':
          description: Forbidden — authenticated user is not a client.

  /api/client/schedules/{id}/cancel-request:
    post:
      security:
        - BearerToken: []
      tags:
        - Trainee Portal
      summary: Submit Session Cancellation Request
      description: |
        Submits a cancellation request for an upcoming scheduled session.

        **Business rules enforced:**
        - The session must belong to the authenticated client.
        - The `scheduled_date` must be in the future.
        - No existing `pending` cancellation request may exist for the same schedule.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The `client_schedules` primary key ID of the upcoming session.
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: Client's stated reason for requesting the cancellation.
                  example: "I have a medical appointment that was moved to this time slot."
      responses:
        '204':
          description: Cancellation request submitted successfully. No response body.
        '404':
          description: Session schedule not found or does not belong to the client.
        '422':
          description: |
            Validation or domain rule failure. Possible reasons:
            - `reason` field is missing or too long.
            - The session date is in the past.
            - A pending cancellation request already exists for this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthenticated.
        '403':
          description: Forbidden — authenticated user is not a client.

