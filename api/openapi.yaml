components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # -------------------------------------------------------------
    # Shared Data Definitions
    # -------------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Admin User"
        email:
          type: string
          example: "admin@fitpad.com"
        role:
          type: string
          enum: [admin, coach, client]
          example: "admin"
        is_suspended:
          type: boolean
          example: false

    Profile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: "Albert"
        last_name:
          type: string
          example: "Wesker"
        gender:
