openapi: 3.0.0
info:
  title: Fitpad Backend API Specification
  description: |
    This document details the endpoints, authentication mechanisms, parameters, schemas, and responses for the `fitpad-app` backend, serving the `fitpad-ui` panels.

    ### API Authentication & Security Guidelines

    1. **Bearer Token Authentication**:
       - Authenticated endpoints require a standard Bearer JWT token in the `Authorization: Bearer <TOKEN>` header.
       - Token management is handled dynamically via Laravel Sanctum.
       - Tokens must be revoked immediately upon logout using `/api/auth/logout`.

    2. **Secure Communication (TLS/HTTPS)**:
       - In staging and production environments, all API routes must be served strictly over HTTPS (TLS 1.2+).
       - Response headers should enforce HSTS (HTTP Strict Transport Security).

    3. **Request Throttling (Rate Limiting)**:
       - The `/api/auth/login` endpoint enforces a rate limit of **5 attempts per minute**.
       - Exceeded limits trigger an HTTP `429 Too Many Requests` status code with a `Retry-After` header.

    4. **Client App Verification (X-API-KEY)**:
       - The `/api/auth/login` route requires an `X-API-KEY` header containing a static secret key to verify that the request originates from the authorized client application (e.g., `fitpad-ui`).
       - *Security Advisory*: Since static client-side keys can be extracted via browser inspector tools, this header must be combined with strict CORS domain restrictions and IP-based rate limits to prevent targeted script impersonation.

    5. **Credential and PIN Validation**:
       - Client and coach access relies on unique `pt_id`/`coach_id` credentials and 6-digit numeric PINs.
       - Hashed PIN storage (e.g., Bcrypt) is mandatory. Clear-text PINs are never stored.

    5. **Client-Side Storage & XSS Prevention**:
       - To protect Bearer tokens from Cross-Site Scripting (XSS) theft, we recommend utilizing `HttpOnly`, `Secure` cookies with `SameSite=Strict` settings.
       - If the frontend stores tokens in `sessionStorage` or `localStorage`, it must strictly sanitize all dynamic API outputs before rendering.

    6. **Zero Hardcoded Secrets**:
       - Decouple all server secrets, database credentials, and SMS gateway tokens via the `.env` file, loaded through Laravel `config()`.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server (artisan serve)
  - url: http://localhost
    description: Local Docker development environment
paths:
  # =========================================================================
  # AUTHENTICATION & PUBLIC
  # =========================================================================
  /api/auth/login:
    post:
      tags:
        - Authentication & Public
      summary: Authenticate User
      description: Logs in an admin using Admin ID & Password, or a coach/client using Coach/PT ID & 6-digit PIN.
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          description: |
            Static client application API key verifying request source integrity.
            *Security Note*: Because this header is readable in client-side code, it must be paired with backend IP rate limiting and CORS domain rules to prevent target abuse.
          example: "fitpad_client_secret_xyz123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Admin Login Credentials
                  required:
                    - admin_id
                    - password
                  properties:
                    admin_id:
                      type: string
                      description: Admin identity tag (e.g. FITPAD-001)
                      example: FITPAD-001
                    password:
                      type: string
                      format: password
                      description: Admin secret password (min 8 chars)
                      example: password
                - type: object
                  title: Coach Login Credentials
                  required:
                    - coach_id
                    - pin
                  properties:
                    coach_id:
                      type: string
                      description: Coach identity tag (e.g. CO-001)
                      example: CO-001
                    pin:
                      type: string
                      pattern: '^[0-9]{6}$'
                      description: 6-digit coach login PIN
                      example: "123456"
                - type: object
                  title: Client Login Credentials
                  required:
                    - pt_id
                    - pin
                  properties:
                    pt_id:
                      type: string
                      description: Client trainee identity tag (e.g. PT0001)
                      example: PT0001
                    pin:
                      type: string
                      pattern: '^[0-9]{6}$'
                      description: 6-digit client login PIN
                      example: "123456"
      responses:
        '200':
          description: Successful authentication. Returns Bearer token and user context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 3|aF83jDkxK28Lksldka923...
                  user:
                    $ref: '#/components/schemas/User'
                  profile:
                    $ref: '#/components/schemas/Profile'
        '422':
          description: Validation error or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too Many Requests (Rate limit exceeded after 5 failed login attempts).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before trying again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Too many login attempts. Please try again in 60 seconds."


  /api/register/check-email:
    post:
      tags:
        - Authentication & Public
      summary: Check Active Subscription by Email
      description: Validates if the email has an active or pending account. Non-unique emails are allowed for client renewals once old accounts transition to 'finished' or 'inactive'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: trainee@example.com
      responses:
        '200':
          description: Validation successful. Returns if an active subscription exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_active_account:
                    type: boolean
                    description: True if an active/pending trainee account already exists under this email.
                    example: false
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/register/lookup:
    get:
      tags:
        - Authentication & Public
      summary: Lookup Existing Client Profile
      description: Query basic trainee profile information by PT ID or Email Address to pre-populate details for renewal registration.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PT ID (e.g. PT-1042) or Email Address of the renewing client.
          example: "PT-1042"
      responses:
        '200':
          description: Client profile found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "PT-1042"
                  first_name:
                    type: string
                    example: "Jane"
                  last_name:
                    type: string
                    example: "Doe"
                  email:
                    type: string
                    example: "jane.doe@example.com"
                  dob:
                    type: string
                    format: date
                    example: "1994-05-12"
        '404':
          description: Client profile not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No active client found matching that PT ID or Email Address."

  /api/register:
    post:
      tags:
        - Authentication & Public
      summary: Register Client (Onboarding / Renewal)
      description: Public multi-step registration flow. Creates or updates User, Profile, Client Details, Client Schedules, and matches with selected Coach. Supports both new trainee registration and existing client package renewals. Note that on successful renewal submission, the system issues a new PT ID to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_type
                - plan_id
                - coach_detail_id
                - schedules
              properties:
                registration_type:
                  type: string
                  enum: [new, renewal]
                  description: Selects onboarding pathway. For renewal, basic details can be omitted as they are pulled from the existing account ID/Email.
                  example: new
                pt_id:
                  type: string
                  description: Optional. Required only when registration_type is renewal.
                  example: "PT-1042"
                first_name:
                  type: string
                  description: Required only when registration_type is new.
                  example: John
                last_name:
                  type: string
                  description: Required only when registration_type is new.
                  example: Doe
                email:
                  type: string
                  format: email
                  description: Required for new registration, or as an alternative lookup identifier for renewal.
                  example: john.doe@example.com
                dob:
                  type: string
                  format: date
                  description: Required only when registration_type is new.
                  example: "1995-04-12"
                pin:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 6-digit numeric PIN code. Required only when registration_type is new. For renewal, this is optional and should only be supplied if the client explicitly requests updating their login PIN.
                  example: "123456"
                phone:
                  type: string
                  example: "+639171234567"
                plan_id:
                  type: integer
                  description: ID of selected session plan
                  example: 1
                coach_detail_id:
                  type: integer
                  description: ID of selected coach
                  example: 2
                schedules:
                  type: array
                  description: Chosen schedule slots
                  items:
                    type: object
                    required:
                      - day_of_week
                      - start_time
                    properties:
                      day_of_week:
                        type: integer
                        minimum: 1
                        maximum: 7
                        description: 1 (Mon) - 7 (Sun)
                        example: 1
                      start_time:
                        type: string
                        pattern: '^\d{2}:\d{2}$'
                        example: "08:00"
      responses:
        '201':
          description: Registration/Renewal completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful.
                  user_id:
                    type: integer
                    example: 5
                  pt_id:
                    type: string
                    example: PT00842
        '422':
          description: Registration validation failed.

  /api/coaches:
    get:
      tags:
        - Authentication & Public
      summary: Get Coach List
      description: Returns all available coaches for onboarding directory or matching.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoachDetailCard'

  /api/coaches/{id}/availability:
    get:
      tags:
        - Authentication & Public
      summary: Get Coach Availability Slots
      description: Fetches availability calendar data for rendering schedule picker in UI.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Coach Details primary ID
      responses:
        '200':
          description: Calendar slots successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  coach_id:
                    type: integer
                    example: 2
                  available_days:
                    type: array
                    items:
                      type: integer
                    example: [1, 3, 5]
                  busy_slots:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-06-05"
                        start_time:
                          type: string
                          example: "09:00"
                        end_time:
                          type: string
                          example: "10:00"

  # =========================================================================
  # ADMIN PORTAL
  # =========================================================================
  /api/admin/dashboard:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Admin Dashboard Metrics
      description: Retrieves high-level metrics for main admin panel view.
      responses:
        '200':
          description: Metrics payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_active_clients:
                    type: integer
                    example: 48
                  total_coaches:
                    type: integer
                    example: 6
                  completed_sessions_month:
                    type: integer
                    example: 182
                  recent_logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityAuditLog'

  /api/admin/clients:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: List Clients
      description: Retrieves all trainee client profiles. Support filters and search.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term matching first name, last name, email, or PT ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, inactive, finished, freezed]
      responses:
        '200':
          description: List of clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientDetailsRow'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Register Client Manually
      description: Direct administrator registration of client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - pin
                - plan_id
                - coach_detail_id
              properties:
                first_name:
                  type: string
                  example: Jane
                last_name:
                  type: string
                  example: Smith
                email:
                  type: string
                  format: email
                  example: jane.smith@example.com
                pin:
                  type: string
                  example: "123456"
                phone:
                  type: string
                  example: "+639178888888"
                plan_id:
                  type: integer
                  example: 2
                coach_detail_id:
                  type: integer
                  example: 1
                schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      day_of_week:
                        type: integer
                        example: 2
                      start_time:
                        type: string
                        example: "14:00"
      responses:
        '201':
          description: Created.

  /api/admin/clients/{id}:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Get Client Profile details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trainee full details, metrics history, and coach info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'

  /api/admin/clients/{id}/pin-reset:
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Reset Trainee PIN
      description: Overwrites client PIN with a temporary system PIN.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                temp_pin:
                  type: string
                  example: "000000"
      responses:
        '200':
          description: PIN reset successful.

  /api/admin/clients/{id}/status:
    put:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Toggle Client Account Status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, active, inactive, finished, freezed]
      responses:
        '200':
          description: Account status changed.

  /api/admin/clients/{id}/transfer:
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Transfer Client to a New Coach
      description: Reassigns the client to a different coach, logs the reason, automatically cancels all future scheduled sessions, and requires plotting a new schedule.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - coach_id
                - reason_category
                - remarks
              properties:
                coach_id:
                  type: string
                  example: "CP-7192"
                reason_category:
                  type: string
                  enum: [Scheduling Conflict, Client Preference, Coach Request, Skillset Match, Other]
                  example: "Scheduling Conflict"
                remarks:
                  type: string
                  example: "Client requested a shift to morning sessions which the current coach cannot accommodate."
      responses:
        '200':
          description: Coach transfer successful.

  /api/admin/clients/{id}/assessments:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Fetch InBody Assessments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assessment'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Upload Assessment Report
      description: Multipart upload of assessment scans.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - weight
                - skeletal_muscle_mass
                - body_fat_mass
                - visceral_fat_level
                - upload_date
              properties:
                weight:
                  type: number
                  example: 72.5
                skeletal_muscle_mass:
                  type: number
                  example: 33.1
                body_fat_mass:
                  type: number
                  example: 15.2
                visceral_fat_level:
                  type: integer
                  example: 6
                coach_remarks:
                  type: string
                  example: "Keep core tight. Scan looks solid."
                upload_date:
                  type: string
                  format: date
                  example: "2026-06-03"
                file:
                  type: string
                  format: binary
                  description: InBody scan PDF/Image
      responses:
        '201':
          description: Assessment uploaded.

  /api/admin/clients/{id}/workouts:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Get Client Workout History
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session workouts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutHistory'

  /api/admin/clients/{id}/workouts/{workoutId}:
    put:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Update Session Workout Details
      description: Edit a workout session's warm-ups, exercises, and general remarks.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: workoutId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - warm_up
                - exercises
              properties:
                warm_up:
                  type: string
                  example: "Thread the needle, dynamic stretching"
                coach_remarks:
                  type: string
                  example: "Good control today. Focus on speed next session."
                scheduled_date:
                  type: string
                  format: date
                  example: "2026-06-03"
                start_time:
                  type: string
                  example: "10:00"
                end_time:
                  type: string
                  example: "11:00"
                exercises:
                  type: array
                  items:
                    type: object
                    required:
                      - exercise_name
                      - sets
                      - reps_details
                    properties:
                      exercise_name:
                        type: string
                        example: "Goblet Squats"
                      sets:
                        type: integer
                        example: 3
                      reps_details:
                        type: string
                        example: "10 reps @ 20kg"
      responses:
        '200':
          description: Workout log updated successfully.

  /api/admin/coaches:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: List Coaches
      responses:
        '200':
          description: List of coaches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachDetailCard'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Register Coach Profile
      description: Admin manually registers a coach and inputs profile details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - temp_password
                - role_level
              properties:
                first_name:
                  type: string
                  example: Marcus
                last_name:
                  type: string
                  example: Reed
                email:
                  type: string
                  format: email
                  example: marcus.reed@fitpad.com
                temp_password:
                  type: string
                  example: "FitpadTemp2026!"
                role_level:
                  type: string
                  enum: [coach, head_coach]
                  example: head_coach
                experience_years:
                  type: integer
                  example: 5
                specializations:
                  type: array
                  items:
                    type: string
                  example: ["HIIT", "Strength training", "Injury Rehab"]
      responses:
        '201':
          description: Coach account created.

  /api/admin/sessions:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Audit Completed Sessions
      description: Audit page showing sessions logged by coaches pending admin approval.
      responses:
        '200':
          description: List of completed training sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompletedSessionAuditRow'

  /api/admin/sessions/{id}/approve:
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Approve Completed Session
      description: Approves session, transitioning status to 'approved' and deducting 1 session from client's balance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session approved. Client balance updated.

  /api/admin/plans:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Get Session Packages
      responses:
        '200':
          description: List of session plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPlan'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Create Session Package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - session_count
              properties:
                name:
                  type: string
                  example: "24 Sessions (2 Months)"
                session_count:
                  type: integer
                  example: 24
      responses:
        '201':
          description: Plan registered.

  /api/admin/plans/{id}:
    delete:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Delete Session Package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan deleted.

  /api/admin/exercises:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: List Master Exercises
      responses:
        '200':
          description: List of exercises.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Register Master Exercise
      description: Registers an exercise into library. Media must be multipart upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - category
              properties:
                name:
                  type: string
                  example: "Russian Twist"
                category:
                  type: string
                  enum: [Strength, Cardio, Core, Mobility, Plyometrics]
                  example: Core
                preview:
                  type: string
                  format: binary
                  description: Preview image or GIF (max 5MB)
      responses:
        '201':
          description: Exercise created.

  /api/admin/exercises/{id}:
    delete:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Delete Exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Exercise deleted.

  /api/admin/users:
    get:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Admin Staff List
      responses:
        '200':
          description: List of administrators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserRow'
    post:
      security:
        - BearerToken: []
      tags:
        - Admin Portal
      summary: Add New Admin
      requestBody:
        required: true
        content:
